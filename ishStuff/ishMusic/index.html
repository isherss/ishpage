<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ishMusic">
  <link rel="stylesheet" href="/files/default.css?v=20261111-heading-mobile-fix">
  <link rel="stylesheet" href="/ishStuff/keyboards/styles.css?v=20261124-centered-tabs">
  <title>ishMusic</title>
  <link rel="icon" href="/files/favicon.ico">
  <style>
    body.kb-page{ text-align:left; }
    .music-content{width:100%;max-width:none;margin:0;color:#a7ffbb;font:13px/1.6 "Lucida Console","Courier New",monospace;text-align:left}
    .music-panel-title{margin:0 0 16px;color:#91e99e;font:clamp(25px,4vw,38px)/1.15 "BlueScreenV1",Consolas,monospace}
    .music-panel[hidden]{display:none!important}
    .spotify-card{padding:18px;border:1px solid #145214;background:#010401;box-shadow:0 0 18px rgba(39,245,73,.06)}
    .spotify-card p{margin:0 0 16px;color:#9db8a3;line-height:1.8}
    .spotify-connect{display:inline-block;padding:10px 14px;border:1px solid #27f549;background:#020803;color:#a7ffbb;font:12px "Lucida Console",monospace;text-decoration:none}
    .spotify-connect:hover,.spotify-connect:focus-visible{background:#06200a;color:#39ff78;outline:1px solid #46bf46}
    .spotify-result{display:grid;grid-template-columns:minmax(100px,180px) minmax(0,1fr);gap:22px;align-items:center}
    .spotify-artist-link{position:relative;display:block;width:100%;padding:8px;overflow:hidden;border:1px solid #287b38;background:#020602;box-shadow:0 0 18px rgba(57,255,120,.12)}
    .spotify-artist-link img{display:block;width:100%;height:auto;filter:grayscale(1) sepia(1) hue-rotate(65deg) saturate(2.1) brightness(.82) contrast(1.16)}
    .spotify-artist-link::after{position:absolute;inset:8px;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0,rgba(0,0,0,.28) 1px,transparent 1px,transparent 4px),linear-gradient(110deg,rgba(38,255,90,.10),rgba(0,20,4,.08));box-shadow:inset 0 0 26px rgba(0,0,0,.48);content:"";pointer-events:none}
    .spotify-result h3{margin:0 0 14px;color:#46bf46;font:clamp(22px,3vw,34px)/1.2 "BlueScreenV1",Consolas,monospace;overflow-wrap:anywhere}
    .spotify-result h3 a{color:inherit;text-decoration:none}
    .spotify-track-name{margin:0 0 11px;color:#b8d9bd;font-size:14px}
    .spotify-brand{display:inline-block;margin-top:20px}
    .spotify-brand img{display:block;width:90px;height:auto}
    .spotify-status{color:#679477;font-size:11px}
    @media(max-width:720px){.spotify-result{grid-template-columns:minmax(80px,120px) minmax(0,1fr);gap:14px}.spotify-artist-link{padding:5px}.spotify-artist-link::after{inset:5px}.spotify-track-name{font-size:12px}}
    .kb-content .music-content{width:100%;max-width:100%;min-width:0;margin:0}
    @media(max-width:720px){.kb-content .music-content{width:100%;max-width:100%;min-width:0;margin:0}}
    body { background: #000; color: #46bf46; text-align: center; }
    .music-content {
      width: min(1100px, 90vw);
      margin: 2rem auto 4rem;
      color: #a7ffbb;
      font: 13px/1.6 "Lucida Console", "Courier New", monospace;
      text-align: left;
    }
    .album-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .album-status { color: #679477; font-size: 11px; }
    .album-search {
      width: min(320px, 55vw);
      padding: 9px 11px;
      border: 1px solid #145214;
      border-radius: 0;
      background: #020803;
      color: #a7ffbb;
      font: inherit;
    }
    .album-search:focus { border-color: #27f549; outline: 1px solid #145214; }
    .table-frame { overflow-x: auto; border: 1px solid #145214; background: #010401; box-shadow: 0 0 18px rgba(39,245,73,.06); }
    .album-table { width: 100%; border-collapse: collapse; text-align: left; }
    .album-table th { padding: 12px 14px; border-bottom: 1px dotted #27f549; background: #041006; color: #46bf46; font: 16px "BlueScreenV1", "Lucida Console", monospace; letter-spacing: .04em; text-transform: uppercase; }
    .album-table td { padding: 11px 14px; border-bottom: 1px dotted #145214; vertical-align: top; }
    .album-table tbody tr:hover { background: #041006; }
    .album-table tbody tr:last-child td { border-bottom: 0; }
    .album-table td:first-child { color: #a7ffbb; font-weight: bold; min-width: 190px; }
    .album-table td:nth-child(2) { color: #46bf46; min-width: 150px; }
    .album-table td:nth-child(3) { color: #9db8a3; min-width: 260px; }
    .empty-state { padding: 24px; color: #679477; text-align: center; }
    @media (max-width: 640px) {
      .music-content { width:min(94vw,100%); max-width:100%; min-width:0; font-size:12px; }
      .album-tools { align-items:stretch; flex-direction:column-reverse; }
      .album-search { width:auto; min-width:0; max-width:100%; }
      .album-table { table-layout:fixed; }
      .album-table th,.album-table td { min-width:0!important; padding:8px 6px; overflow-wrap:anywhere; }
      .table-frame { width:100%; max-width:100%; overflow-x:hidden; }
    }
  </style>
</head>
<body class="kb-page">
  <main class="kb-shell">
    <nav class="kb-topbar" aria-label="Site navigation">
      <a href="/ishStuff/">← ishStuff</a>
      <h1 class="kb-heading page-title">ishMusic</h1>
      <a href="/">Home</a>
    </nav>

    <div class="kb-layout">
      <aside class="kb-sidebar" aria-label="Music pages">
        <h2 class="kb-sidebar-title">Pages</h2>
        <nav class="kb-nav" id="musicNav">
          <a href="#albums" data-page="albums">albumRecommendations</a>
          <a href="#spotifyArtist" data-page="spotifyArtist" aria-current="page">spotifyArtist</a>
        </nav>
      </aside>

      <article class="kb-content" id="musicArticle" aria-live="polite">
        <section class="music-panel" id="albums" data-page-panel hidden>
          <p class="kb-article-meta">albumRecommendations</p>
          <h2 class="music-panel-title">Album Recommendations</h2>
          <div class="music-content">
            <div class="album-tools">
              <span class="album-status" id="albumStatus" role="status">[ LOADING ALBUM RECOMMENDATIONS… ]</span>
              <input class="album-search" id="albumSearch" type="search" placeholder="Filter albums, artists, notes…" aria-label="Filter album recommendations" disabled>
            </div>
            <div class="table-frame">
              <table class="album-table" aria-label="Album recommendations">
                <thead><tr id="albumHeaders"></tr></thead>
                <tbody id="albumRows"><tr><td class="empty-state">Reading album recs.xlsx…</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="music-panel" id="spotifyArtist" data-page-panel hidden>
          <p class="kb-article-meta">spotifyArtist</p>
          <h2 class="music-panel-title">Who I'm listening to a lot right now:</h2>
          <div class="music-content">
            <div class="spotify-card" id="spotifyArtistCard" aria-live="polite">
              <p class="spotify-status" id="spotifyArtistStatus">Loading Spotify listening history…</p>
            </div>
          </div>
        </section>
      </article>
    </div>
  </main>
  <script>
    (() => {
      const nav=[...document.querySelectorAll("#musicNav a[data-page]")];
      const panels=[...document.querySelectorAll("[data-page-panel]")];
      function showMusicPage(id,updateHistory=false){const panel=document.getElementById(id);const link=nav.find(item=>item.dataset.page===id);if(!panel||!link)return showMusicPage("albums");panels.forEach(item=>{item.hidden=item!==panel});nav.forEach(item=>{if(item===link)item.setAttribute("aria-current","page");else item.removeAttribute("aria-current")});if(updateHistory)history.replaceState(null,"","#"+id)}
      nav.forEach(link=>link.addEventListener("click",event=>{event.preventDefault();showMusicPage(link.dataset.page,true)}));
      window.addEventListener("hashchange",()=>showMusicPage(location.hash.slice(1)||"spotifyArtist"));
      showMusicPage(location.hash.slice(1)||"spotifyArtist");
    })();
  </script>

  <script src="/ishScript.js"></script>
  <script>
    async function loadSpotifyArtist(){
      const card=document.getElementById("spotifyArtistCard");
      const status=document.getElementById("spotifyArtistStatus");
      try{
        const response=await fetch("/ishStuff/ishMusic/spotify.php?action=artist",{cache:"no-store"});
        const data=await response.json();
        if(data.connected===false){status.textContent=data.configured===false?"Spotify is ready to connect once spotify-config.php is installed in rngmine/private.":"Spotify has not been connected yet.";const link=document.createElement("a");link.className="spotify-connect";link.href="/ishStuff/ishMusic/spotify.php?action=connect";link.textContent="CONNECT NAT_LYISH SPOTIFY";card.append(link);return;}
        if(!response.ok||data.error)throw new Error(data.error||"Spotify is temporarily unavailable.");
        if(!data.artist){status.textContent="No recently played tracks were returned for the past seven days.";return;}
        card.replaceChildren();
        const layout=document.createElement("div");layout.className="spotify-result";
        if(data.image){const imageLink=document.createElement("a");imageLink.className="spotify-artist-link";imageLink.href=data.artistUrl;imageLink.target="_blank";imageLink.rel="noopener noreferrer";const image=document.createElement("img");image.src=data.image;image.alt=`${data.artist} on Spotify`;imageLink.append(image);layout.append(imageLink);}
        const details=document.createElement("div");
        const name=document.createElement("h3");const artistLink=document.createElement("a");artistLink.href=data.artistUrl;artistLink.target="_blank";artistLink.rel="noopener noreferrer";artistLink.textContent=data.artist;name.append(artistLink);
        details.append(name);
        if(data.track){
          const song=document.createElement("p");song.className="spotify-track-name";song.textContent=`Most played song: ${data.track}`;
          const play=document.createElement("a");play.className="spotify-connect";play.href=data.trackUrl;play.target="_blank";play.rel="noopener noreferrer";play.textContent="▶ LISTEN ON SPOTIFY";
          details.append(song,play);
        }
        layout.append(details);card.replaceChildren(layout);
        const brandLink=document.createElement("a");brandLink.className="spotify-brand";brandLink.href="https://open.spotify.com/";brandLink.target="_blank";brandLink.rel="noopener noreferrer";brandLink.setAttribute("aria-label","Spotify");
        const brand=document.createElement("img");brand.src="https://developer-assets.spotifycdn.com/images/guidelines/design/full-logo-framed.svg";brand.alt="Spotify";brandLink.append(brand);card.append(brandLink);
      }catch(error){status.textContent=error.message||"Could not load Spotify listening history.";}
    }
    loadSpotifyArtist();

    // Source of truth: /files/IshMusic/album recs.xlsx. Save the workbook and reload this page to refresh the table.
    const WORKBOOK_URL = "/files/IshMusic/album%20recs.xlsx";
    const statusEl = document.getElementById("albumStatus");
    const headersEl = document.getElementById("albumHeaders");
    const rowsEl = document.getElementById("albumRows");
    const searchEl = document.getElementById("albumSearch");
    let albumData = { headers: [], rows: [] };
    let lastWorkbookBytes = null;

    async function readZipEntry(zipBytes, entry) {
      const view = new DataView(zipBytes);
      const local = entry.localOffset;
      const nameLength = view.getUint16(local + 26, true);
      const extraLength = view.getUint16(local + 28, true);
      const start = local + 30 + nameLength + extraLength;
      const compressed = zipBytes.slice(start, start + entry.compressedSize);
      if (entry.method === 0) return new TextDecoder().decode(compressed);
      if (entry.method !== 8) throw new Error("Unsupported workbook compression method.");
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new TextDecoder().decode(await new Response(stream).arrayBuffer());
    }

    function findZipEntries(bytes) {
      const view = new DataView(bytes);
      let end = bytes.byteLength - 22;
      const min = Math.max(0, bytes.byteLength - 65557);
      while (end >= min && view.getUint32(end, true) !== 0x06054b50) end--;
      if (end < min) throw new Error("This file is not a readable Excel workbook.");
      const count = view.getUint16(end + 10, true);
      const centralSize = view.getUint32(end + 12, true);
      const centralOffset = view.getUint32(end + 16, true);
      const actualCentralStart = end - centralSize;
      const archiveOffset = actualCentralStart - centralOffset;
      let cursor = centralOffset + archiveOffset;
      const entries = {};
      for (let i = 0; i < count; i++) {
        if (view.getUint32(cursor, true) !== 0x02014b50) throw new Error("Could not read workbook file list.");
        const method = view.getUint16(cursor + 10, true);
        const compressedSize = view.getUint32(cursor + 20, true);
        const nameLength = view.getUint16(cursor + 28, true);
        const extraLength = view.getUint16(cursor + 30, true);
        const commentLength = view.getUint16(cursor + 32, true);
        const localOffset = view.getUint32(cursor + 42, true) + archiveOffset;
        const name = new TextDecoder().decode(bytes.slice(cursor + 46, cursor + 46 + nameLength));
        entries[name] = { method, compressedSize, localOffset };
        cursor += 46 + nameLength + extraLength + commentLength;
      }
      return entries;
    }

    function cellColumn(cellRef) {
      return cellRef.replace(/[0-9]/g, "");
    }

    async function loadWorkbook(silent = false) {
      if (!silent) statusEl.textContent = "[ READING ALBUM RECS.XLSX… ]";
      const response = await fetch(WORKBOOK_URL + "?updated=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("Could not load /files/IshMusic/album recs.xlsx (" + response.status + ").");
      const bytes = await response.arrayBuffer();
      const currentBytes = new Uint8Array(bytes);
      if (lastWorkbookBytes && currentBytes.length === lastWorkbookBytes.length && currentBytes.every((byte, index) => byte === lastWorkbookBytes[index])) return;
      lastWorkbookBytes = currentBytes;
      const entries = findZipEntries(bytes);
      const sharedXml = new DOMParser().parseFromString(await readZipEntry(bytes, entries["xl/sharedStrings.xml"]), "application/xml");
      const sheetXml = new DOMParser().parseFromString(await readZipEntry(bytes, entries["xl/worksheets/sheet1.xml"]), "application/xml");
      const shared = Array.from(sharedXml.getElementsByTagName("si"), item => Array.from(item.getElementsByTagName("t"), t => t.textContent).join(""));
      const sharedIndex = sharedXml.documentElement.namespaceURI;
      const ns = sharedIndex;
      const sheetData = Array.from(sheetXml.getElementsByTagNameNS(ns, "row"));
      const parsed = [];
      for (const row of sheetData) {
        const values = {};
        for (const cell of Array.from(row.children).filter(node => node.localName === "c")) {
          const valueNode = Array.from(cell.children).find(node => node.localName === "v");
          const inlineNode = Array.from(cell.children).find(node => node.localName === "is");
          let value = valueNode ? valueNode.textContent : inlineNode ? Array.from(inlineNode.getElementsByTagNameNS(ns, "t"), t => t.textContent).join("") : "";
          if (cell.getAttribute("t") === "s" && value !== "") value = shared[Number(value)] || "";
          const column = cellColumn(cell.getAttribute("r"));
          if (["B", "C", "D"].includes(column)) values[column] = value;
        }
        if (Object.values(values).some(value => String(value).trim())) parsed.push({ rowNumber: Number(row.getAttribute("r")), values });
      }
      const header = parsed.find(row => row.values.B === "Album Name" && row.values.C === "Artist Name");
      if (!header) throw new Error("Expected Album Name, Artist Name, and Vibe Notes columns were not found.");
      const headerRow = header.rowNumber;
      const headers = ["B", "C", "D"].map(col => header.values[col] || "");
      const rows = parsed.filter(row => row.rowNumber > headerRow).map(row => [row.values.B || "", row.values.C || "", row.values.D || ""]).filter(row => row.some(cell => String(cell).trim()));
      albumData = { headers, rows };
      renderTable();
      searchEl.disabled = false;
      statusEl.textContent = `[ ${rows.length} ALBUM RECS ]`;
    }

    function renderTable() {
      headersEl.replaceChildren(...albumData.headers.map(label => {
        const th = document.createElement("th");
        th.scope = "col";
        th.textContent = label;
        return th;
      }));
      const query = searchEl.value.trim().toLocaleLowerCase();
      const filtered = albumData.rows.filter(row => row.join(" ").toLocaleLowerCase().includes(query));
      if (!filtered.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.className = "empty-state";
        td.colSpan = Math.max(1, albumData.headers.length);
        td.textContent = "No album recommendations match that filter.";
        rowsEl.replaceChildren(tr.appendChild(td).parentElement);
        return;
      }
      rowsEl.replaceChildren(...filtered.map(row => {
        const tr = document.createElement("tr");
        row.forEach(value => {
          const td = document.createElement("td");
          td.textContent = value;
          tr.append(td);
        });
        return tr;
      }));
    }

    searchEl.addEventListener("input", renderTable);
    loadWorkbook().catch(error => {
      statusEl.textContent = "[ ALBUM LIST UNAVAILABLE ]";
      rowsEl.innerHTML = "<tr><td class=\"empty-state\" colspan=\"3\"></td></tr>";
      rowsEl.querySelector("td").textContent = error.message + " Reload the page after saving the workbook.";
      console.error(error);
    });
    // Refresh the table soon after a saved workbook change.
    window.setInterval(() => loadWorkbook(true).catch(error => console.error(error)), 30000);
  </script>
</body>
</html>
