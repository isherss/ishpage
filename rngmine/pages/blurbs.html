  <section class="leaderboard-panel blurb-panel" id="blurbPanel" role="tabpanel" aria-labelledby="blurbTab" hidden>
    <div class="leaderboard-head">
      <div><h1>Roll blurbs</h1><p>ANSWERS SHARED WITH ROLLS</p></div>
      <button class="account-btn" id="blurbRefresh" type="button">Refresh</button>
    </div>
    <p class="leaderboard-status visually-hidden" id="blurbStatus" role="status" aria-live="polite">Open this tab to load roll blurbs.</p>
    <details class="blurb-filter-disclosure">
      <summary>Search and filter blurbs</summary>
      <div class="blurb-filters" aria-label="Search and filter roll blurbs">
      <label class="blurb-filter-search">Search answers or users<input id="blurbSearch" type="search" placeholder="Search blurbs..." autocomplete="off"></label>
      <label>User<select id="blurbUserFilter"><option value="">All users</option></select></label>
      <label>Rarity<select id="blurbRarityFilter"><option value="">All rarities</option><option value="trash">Trash</option><option value="common">Common</option><option value="uncommon">Uncommon</option><option value="rare">Rare</option><option value="epic">Epic</option><option value="anomaly">Anomaly</option><option value="mythic">Mythic</option><option value="divine">Divine</option></select></label>
      <label>From<input id="blurbDateFrom" type="date"></label>
      <label>To<input id="blurbDateTo" type="date"></label>
      <button class="account-btn blurb-filter-clear" id="blurbFiltersClear" type="button">Clear filters</button>
    </div>
        </details>
    <div class="leaderboard-table-wrap">
      <table class="leaderboard-table blurb-table">
        <thead><tr><th scope="col">#</th><th scope="col">Miner</th><th scope="col">Roll · answer · time</th></tr></thead>
        <tbody id="blurbRows"></tbody>
      </table>
    </div>
  </section>
