<!DOCTYPE html>
<html>

<head>
  <!-- Required meta tags -->
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Stylesheet link -->
  <link rel="stylesheet" href="/files/default.css?v=20261029-mobile5">

  <title>Ish Projects</title>

  <!-- unique page styles -->
  <style>
    /* Project descriptions: edit the PROJECT_CARDS array below. */
    .project-card-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 12px;
      width: min(1000px, 88vw);
      font-family: "Lucida Console", monospace;
      text-align: left;
      margin: 1rem auto 4rem;
    }
    .project-card {
      display: block;
      text-align: left;
      min-height: 110px;
      padding: 16px;
      border: 1px solid #145214;
      background: #020803;
      color: #a7ffbb;
      text-decoration: none;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .project-card:link, .project-card:visited { color: #a7ffbb; }
    .project-card:hover, .project-card:focus-visible {
      border-color: #27f549;
      background: #041006;
      transform: translateY(-2px);
      outline: none;
    }
    .project-card h2 {
      margin: 0;
      color: #46bf46;
      font: 18px "BlueScreenV1", monospace;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .project-card p { margin: 11px 0 0; font-size: 13px; line-height: 1.65; }
    .project-card-hint { display: block; margin-top: 12px; color: #679477; font-size: 10px; }
  </style>
  <link rel="icon" href="/files/favicon.ico">
</head>

<body style="background-color:#000000; color: green;  text-align: center;">
  <span class="page-title" style="font-family: 'BlueScreenV1'; line-height: 80%; font-size: 10vw; display: inline-block;">
ishProjects
  </span>
  <br><br>
  <span>
      <!-- home button -->
      <a href="/">
          <span style='font-family: "Lucida Console";line-height: 1vw;font-size: 1vw;display: inline-block;'>
              <img src="/images/house.png" style="height:3vw;width:3vw;"
                  onmouseover="this.src='/images/househover.png'" onmouseout="this.src='/images/house.png'">
          </span>
      </a>
      <!-- top row button links -->
      <p class="page-navigation" style="color: green;">

about

          </a>
          <a href="/ishthoughtson">

thoughtson

          </a>

  <span style="border-top-style: dotted;border-color: green;padding-right: 20vw;padding-left: 20vw;">

  </span>
  <!-- end button links -->

  <!-- text -->

  <div class="project-card-list" id="projectCardList"></div>

<!-- script src attribute -->
<script src="/ishScript.js"></script>

<!-- Edit project titles, descriptions, and links here. Set href to null for a non-clickable card. -->
<script>
  const PROJECT_CARDS = [
    {
      title: "RNGMine",
      description: "Ever wanted to mine coal for more rolls from rngdle.com?",
      href: "/rngmine/",
      linkText: "Open RNGMine"
    },
    {
      title: "Mechanical Keyboards",
      description: "I like making mechanical keyboard designs and firmware, specfically for 40% or smaller. Check them out!",
      href: null,
      linkText: "See some keyboards"
    },
    {
      title: "Destiny 2 Raid Farming",
      description: "All I do in Destiny 2 is play raids over and over, check out which ones I've done recently...",
      href: null,
      linkText: "Check my raid activity"
    }
  ];

  const cardList = document.getElementById("projectCardList");
  PROJECT_CARDS.forEach(({ title, description, href, linkText }) => {
    const card = document.createElement(href ? "a" : "article");
    card.className = "project-card";
    if (href) card.href = href;

    const heading = document.createElement("h2");
    heading.textContent = title;
    const body = document.createElement("p");
    body.textContent = description;
    card.append(heading, body);
    if (href && linkText) {
      const hint = document.createElement("span");
      hint.className = "project-card-hint";
      hint.textContent = linkText + " →";
      card.append(hint);
    }
    cardList.append(card);
  });
</script>

</body>
