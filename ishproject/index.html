<!DOCTYPE html>
<html>

<head>
  <!-- Required meta tags -->
  <meta charset="UTF-8">

  <!-- Stylesheet link -->
  <link rel="stylesheet" href="/files/default.css">

  <title>Ish Projects</title>

  <!-- unique page styles -->
  <style>
    .column-arrow {
      float: left;
      width: 10%;
      margin-left: 5%;
      text-align: center;
    }

    .column-side {
      float: left;
      text-align: center;
      width: 23%;
      margin-right: 8%;
      margin-left: 8%;
      text-align: center;
    }

    .column-middle {
      float: left;
      width: 67%;
      text-align: center;
      margin-right: 8%;
      margin-left: 8%;
      margin-top: 1%
    }
  </style>
  <link rel="icon" href="/files/favicon.ico">
</head>

<body style="background-color:#000000; color: green;  text-align: center;">
  <span style="font-family: 'BlueScreen'; line-height: 80%; font-size: 10vw; display: inline-block;">
ishProjects
  </span>
  <br><br>
  <span>
      <!-- home button -->
      <a href="/">
          <span style='font-family: "Lucida Console";line-height: 1vw;font-size: 1vw;display: inline-block;'>
              <img src="/images/house.png" style="height:3vw;width:3vw;"
                  onmouseover="this.src='/images/househover.png'" onmouseout="this.src='/images/house.png'">
          </span>
      </a>
      <!-- top row button links -->
      <p style="color: green;">
        <a href="/ishabout">
          <span style='font-family: "BlueScreen";line-height: 0.2vw;font-size: 3vw;display: inline-block;text-align: center;margin-right:2vw;'>
about
          </span>
          </a>
          <a href="/ishthoughtson">
              <span style='font-family: "BlueScreen";line-height: 0.2vw;font-size: 3vw;display: inline-block;text-align: center;margin-right:2vw;'>
thoughtson
              </span>
          </a>
          <a href="/ishmusic">
              <span style='font-family: "BlueScreen";line-height: 0.2vw;font-size: 3vw;display: inline-block;text-align: center;margin-right:2vw;'>
music
              </span>
          </a>
              <span style='font-family: "BlueScreen";line-height: 0.2vw;font-size: 3vw;display: inline-block;text-align: center;color:#46bf46;'>
projects
              </span>
      </p>
  </span>
  <br>
  <span style="border-top-style: dotted;border-color: green;padding-right: 20vw;padding-left: 20vw;">

  </span>
  <!-- end button links -->

  <!-- text -->

  <div class="row">
    <div class="column-arrow">
      <span id="arrow-keyboard" style="font-family: 'BlueScreen'; line-height: 100%; font-size: 3.5vw;">
      </span>
      <span style="font-family: 'BlueScreen'; line-height: 100%; font-size: 3.5vw;">
        <br>
      </span>
      <span id="arrow-coding" style="font-family: 'BlueScreen'; line-height: 100%; font-size: 3.5vw;">
      </span>
      <span style="font-family: 'BlueScreen'; line-height: 100%; font-size: 3.5vw;">
        <br><br><br>
      </span>
      <span id="arrow-photography" style="font-family: 'BlueScreen'; line-height: 100%; font-size: 3.5vw;">
      </span>
    </div>

    <div class="column-side">
      <a>
        <span id="keyboard-dropdown" style="font-family: 'BlueScreen'; line-height: 100%; font-size: 3.5vw;text-align: center;">
          <strong> keyboards </strong>
        </span>
      </a>
      <a>
        <span id="coding-dropdown" style="font-family: 'BlueScreen'; line-height: 100%; font-size: 3.5vw;text-align: center;">
          <br> <br>
          <strong> coding </strong>
        </span>
      </a>
      <a href="/ishproject/photography">
        <span id="photography-dropdown" style="font-family: 'BlueScreen'; line-height: 100%; font-size: 3.5vw;text-align: center;">
          <br> <br>
          <strong>photography</strong>
        </span>
      </a>
    </div>

    <div class="column-middle">
      <span id="info" , style="font-size: 1.4vw;">
        Info will appear here upon hover!
      </span>

    </div>
  </div>

<!-- script src attribute -->
<script src="/ishScript.js"></script>

<!-- unique page scripts -->
<script>
  document.getElementById('keyboard-dropdown').addEventListener("mouseover", keyboardDrop);
  document.getElementById('keyboard-dropdown').addEventListener("mouseout", mouseOuters);
  document.getElementById('coding-dropdown').addEventListener("mouseover", codingDrop);
  document.getElementById('coding-dropdown').addEventListener("mouseout", mouseOuters);
  document.getElementById('photography-dropdown').addEventListener("mouseover", photographyDrop);
  document.getElementById('photography-dropdown').addEventListener("mouseout", mouseOuters);
  async function keyboardDrop() {
    let file = "/files/projects/keyboards.txt"
    let myObject = await fetch(file);
    let myText = await myObject.text();
    document.getElementById("info").innerHTML = myText;
    document.getElementById("arrow-keyboard").innerHTML = "<strong>  -> </strong>";

  }

  function codingDrop() {
    document.getElementById('info').innerHTML = "blah blah blah i coded this site and it sucked";
    document.getElementById("arrow-coding").innerHTML = "<br> <strong>  -> </strong>";
  }

  async function photographyDrop() {
    let file = "/files/projects/photography.txt"
    let myObject = await fetch(file);
    let myText = await myObject.text();
    document.getElementById("info").innerHTML = myText;
    document.getElementById("arrow-photography").innerHTML = "<strong>  -> </strong>";

  }
  function mouseOuters() {
    document.getElementById('info').innerHTML = "Info will appear here upon hover!"
    document.getElementById("arrow-keyboard").innerHTML = "  ";
    document.getElementById("arrow-coding").innerHTML = "";
    document.getElementById("arrow-photography").innerHTML = "";
  }
</script>

</body>


</html>
