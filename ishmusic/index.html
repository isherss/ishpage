  <style>
    body { background: #000; color: #46bf46; text-align: center; }
    .music-content {
      width: min(1100px, 90vw);
      margin: 2rem auto 4rem;
      color: #a7ffbb;
      font: 13px/1.6 "Lucida Console", "Courier New", monospace;
      text-align: left;
    }
    .favorite-song { display:grid; grid-template-columns:1fr; gap:16px; align-items:center; margin:0 0 22px; padding:14px; border:1px solid #145214; background:#010401; box-shadow:0 0 18px rgba(39,245,73,.06); }
    .favorite-song h2 { margin:0 0 10px; color:#46bf46; font:16px "BlueScreenV1", "Lucida Console", monospace; letter-spacing:.04em; text-transform:uppercase; }
    .favorite-player-frame { width:160px; height:90px; border:1px solid #145214; background:#000; }
    .favorite-player-frame iframe { display:block; width:100%; height:100%; border:0; }
    .favorite-song-controls { display:grid; grid-template-columns:auto minmax(100px,1fr) auto; gap:10px; align-items:center; }
    .favorite-song-button { min-height:36px; padding:7px 12px; border:1px solid #27f549; border-radius:0; background:#020803; color:#a7ffbb; font:12px "Lucida Console", monospace; cursor:pointer; }
    .favorite-song-button:hover,.favorite-song-button:focus-visible { background:#06200a; outline:1px solid #46bf46; }
    .favorite-waveform { width:100%; height:42px; display:block; color:#27f549; cursor:pointer; touch-action:none; user-select:none; }
    .favorite-waveform:focus-visible { outline:1px solid #46bf46; outline-offset:2px; }
    .favorite-volume { display:flex; align-items:center; gap:7px; color:#679477; font-size:10px; white-space:nowrap; }
    .favorite-volume input { width:90px; height:16px; margin:0; appearance:none; -webkit-appearance:none; background:transparent; cursor:pointer; }
    .favorite-volume input::-webkit-slider-runnable-track { height:6px; border:1px solid #145214; background:#06200a; }
    .favorite-volume input::-moz-range-track { height:6px; border:1px solid #145214; background:#06200a; }
    .favorite-volume input::-webkit-slider-thumb { width:14px; height:14px; margin-top:-5px; appearance:none; -webkit-appearance:none; border:1px solid #27f549; border-radius:0; background:#000; box-shadow:0 0 7px #27f549; }
    .favorite-volume input::-moz-range-thumb { width:12px; height:12px; border:1px solid #27f549; border-radius:0; background:#000; box-shadow:0 0 7px #27f549; }
    .favorite-volume input:focus-visible { outline:1px solid #46bf46; outline-offset:3px; }
    .favorite-song-time { grid-column:2; display:flex; justify-content:space-between; color:#679477; font-size:10px; }
    @media (max-width:640px) { .favorite-song { grid-template-columns:1fr; } .favorite-player-frame { width:100%; height:auto; aspect-ratio:16/9; } .favorite-song-controls { grid-template-columns:auto minmax(40px,1fr); } .favorite-volume { grid-column:1/-1; } .favorite-song-time { grid-column:1; } }
    .album-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .album-status { color: #679477; font-size: 11px; }
    .album-search {
      width: min(320px, 55vw);
      padding: 9px 11px;
      border: 1px solid #145214;
      border-radius: 0;
      background: #020803;
      color: #a7ffbb;
      font: inherit;
    }
    .album-search:focus { border-color: #27f549; outline: 1px solid #145214; }
    .table-frame { overflow-x: auto; border: 1px solid #145214; background: #010401; box-shadow: 0 0 18px rgba(39,245,73,.06); }
    .album-table { width: 100%; border-collapse: collapse; text-align: left; }
    .album-table th { padding: 12px 14px; border-bottom: 1px dotted #27f549; background: #041006; color: #46bf46; font: 16px "BlueScreenV1", "Lucida Console", monospace; letter-spacing: .04em; text-transform: uppercase; }
    .album-table td { padding: 11px 14px; border-bottom: 1px dotted #145214; vertical-align: top; }
    .album-table tbody tr:hover { background: #041006; }
    .album-table tbody tr:last-child td { border-bottom: 0; }
    .album-table td:first-child { color: #a7ffbb; font-weight: bold; min-width: 190px; }
    .album-table td:nth-child(2) { color: #46bf46; min-width: 150px; }
    .album-table td:nth-child(3) { color: #9db8a3; min-width: 260px; }
    .empty-state { padding: 24px; color: #679477; text-align: center; }
    @media (max-width: 640px) {
      .music-content { width: 94vw; font-size: 12px; }
      .album-tools { align-items: stretch; flex-direction: column-reverse; }
      .album-search { width: auto; }
      .album-table th, .album-table td { padding: 9px; }
    }
  </style>

  <main class="music-content">
    <section class="favorite-song" aria-labelledby="favoriteSongTitle">
      <audio id="favoriteSongAudio" preload="metadata" src="/files/IshMusic/JACKIE%27S%20BOX%20-%20FNAF%20MIMIC%20SONG%20(Secret%20Of%20The%20Mimic%20Original%20Song).mp3"></audio>
      <div>
        <h2 id="favoriteSongTitle">Listen to my favorite song</h2>
        <div class="favorite-song-controls">
          <button class="favorite-song-button" id="favoriteSongToggle" type="button" aria-label="Play favorite song" disabled>▶ PLAY</button>
          <canvas class="favorite-waveform" id="favoriteSongWaveform" role="slider" tabindex="0" aria-label="Seek through favorite song" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00 of 0:00" width="720" height="84"></canvas>
          <label class="favorite-volume"><span>VOL</span><input id="favoriteSongVolume" type="range" min="0" max="100" value="70" aria-label="Favorite song volume" disabled><span id="favoriteSongVolumeValue">70%</span></label>
          <div class="favorite-song-time"><span id="favoriteSongElapsed">0:00</span><span id="favoriteSongDuration">0:00</span></div>
        </div>
      </div>
    </section>
<div class="album-tools">
      <span class="album-status" id="albumStatus" role="status">[ LOADING ALBUM RECOMMENDATIONS… ]</span>
      <input class="album-search" id="albumSearch" type="search" placeholder="Filter albums, artists, notes…" aria-label="Filter album recommendations" disabled>
    </div>
    <div class="table-frame">
      <table class="album-table" aria-label="Album recommendations">
        <thead><tr id="albumHeaders"></tr></thead>
        <tbody id="albumRows"><tr><td class="empty-state">Reading album recs.xlsx…</td></tr></tbody>
      </table>

  </main>
    <script>
    (() => {
      const audio=document.getElementById("favoriteSongAudio"), button=document.getElementById("favoriteSongToggle"), volume=document.getElementById("favoriteSongVolume"), volumeValue=document.getElementById("favoriteSongVolumeValue"), canvas=document.getElementById("favoriteSongWaveform"), ctx=canvas.getContext("2d"), elapsed=document.getElementById("favoriteSongElapsed"), duration=document.getElementById("favoriteSongDuration");
      const bars=Array.from({length:72},(_,i)=>.18+Math.abs(Math.sin(i*12.9898)*Math.cos(i*4.1414))*.82);
      let ready=false;
      function formatTime(seconds){seconds=Math.max(0,Math.floor(seconds||0));return Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");}
      function drawWave(progress=0){const w=canvas.width,h=canvas.height,mid=h/2,barWidth=5,gap=5;ctx.clearRect(0,0,w,h);bars.forEach((level,i)=>{const x=i*(barWidth+gap),amp=level*(h*.42),active=(i/(bars.length-1))<=progress;ctx.fillStyle=active?"#46bf46":"#145214";ctx.fillRect(x,mid-amp,barWidth,amp*2);});if(progress>0&&progress<1){const x=progress*w;ctx.fillStyle="#a7ffbb";ctx.fillRect(x-1,4,2,h-8);}}
      function updateSeek(time,total){const current=Math.max(0,Math.min(time,total||0));elapsed.textContent=formatTime(current);duration.textContent=formatTime(total);canvas.setAttribute("aria-valuemax",String(Math.floor(total||0)));canvas.setAttribute("aria-valuenow",String(Math.floor(current)));canvas.setAttribute("aria-valuetext",formatTime(current)+" of "+formatTime(total));drawWave(total?current/total:0);}
      function seekFromPointer(event){if(!ready)return;const rect=canvas.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),total=audio.duration;if(!total)return;const target=ratio*total;audio.currentTime=target;updateSeek(target,total);}
      function updateButton(){const playing=!audio.paused&&!audio.ended;button.textContent=playing?"Ⅱ PAUSE":"▶ PLAY";button.setAttribute("aria-label",playing?"Pause favorite song":"Play favorite song");}
      drawWave();
      canvas.addEventListener("pointerdown",event=>{if(!ready)return;event.preventDefault();canvas.setPointerCapture(event.pointerId);seekFromPointer(event);});
      canvas.addEventListener("pointermove",event=>{if(ready&&canvas.hasPointerCapture(event.pointerId))seekFromPointer(event);});
      canvas.addEventListener("keydown",event=>{if(!ready)return;const total=audio.duration,current=audio.currentTime;let target=current;if(event.key==="ArrowRight")target=current+5;else if(event.key==="ArrowLeft")target=current-5;else if(event.key==="PageUp")target=current+15;else if(event.key==="PageDown")target=current-15;else if(event.key==="Home")target=0;else if(event.key==="End")target=total;else return;event.preventDefault();target=Math.max(0,Math.min(total,target));audio.currentTime=target;updateSeek(target,total);});
      audio.addEventListener("loadedmetadata",()=>{ready=true;button.disabled=false;volume.disabled=false;updateSeek(0,audio.duration);});
      audio.addEventListener("timeupdate",()=>updateSeek(audio.currentTime,audio.duration));
      audio.addEventListener("play",updateButton);
      audio.addEventListener("pause",updateButton);
      audio.addEventListener("ended",()=>{updateButton();updateSeek(0,audio.duration);});
      audio.addEventListener("error",()=>{button.disabled=true;duration.textContent="AUDIO UNAVAILABLE";});
      audio.volume=Number(volume.value)/100;
      button.addEventListener("click",()=>{if(!ready)return;if(audio.paused)audio.play().catch(()=>{});else audio.pause();});
      volume.addEventListener("input",()=>{const value=Number(volume.value);volumeValue.textContent=value+"%";audio.volume=value/100;});
    })();
  </script>

  <script src="/ishScript.js"></script>
  <script>
    // Source of truth: /files/IshMusic/album recs.xlsx. Save the workbook and reload this page to refresh the table.
    const WORKBOOK_URL = "/files/IshMusic/album%20recs.xlsx";
    const statusEl = document.getElementById("albumStatus");
    const headersEl = document.getElementById("albumHeaders");
    const rowsEl = document.getElementById("albumRows");
    const searchEl = document.getElementById("albumSearch");
    let albumData = { headers: [], rows: [] };
    let lastWorkbookBytes = null;

    async function readZipEntry(zipBytes, entry) {
      const view = new DataView(zipBytes);
      const local = entry.localOffset;
      const nameLength = view.getUint16(local + 26, true);
      const extraLength = view.getUint16(local + 28, true);
      const start = local + 30 + nameLength + extraLength;
      const compressed = zipBytes.slice(start, start + entry.compressedSize);
      if (entry.method === 0) return new TextDecoder().decode(compressed);
      if (entry.method !== 8) throw new Error("Unsupported workbook compression method.");
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new TextDecoder().decode(await new Response(stream).arrayBuffer());
    }

    function findZipEntries(bytes) {
      const view = new DataView(bytes);
      let end = bytes.byteLength - 22;
      const min = Math.max(0, bytes.byteLength - 65557);
      while (end >= min && view.getUint32(end, true) !== 0x06054b50) end--;
      if (end < min) throw new Error("This file is not a readable Excel workbook.");
      const count = view.getUint16(end + 10, true);
      const centralSize = view.getUint32(end + 12, true);
      const centralOffset = view.getUint32(end + 16, true);
      const actualCentralStart = end - centralSize;
      const archiveOffset = actualCentralStart - centralOffset;
      let cursor = centralOffset + archiveOffset;
      const entries = {};
      for (let i = 0; i < count; i++) {
        if (view.getUint32(cursor, true) !== 0x02014b50) throw new Error("Could not read workbook file list.");
        const method = view.getUint16(cursor + 10, true);
        const compressedSize = view.getUint32(cursor + 20, true);
        const nameLength = view.getUint16(cursor + 28, true);
        const extraLength = view.getUint16(cursor + 30, true);
        const commentLength = view.getUint16(cursor + 32, true);
        const localOffset = view.getUint32(cursor + 42, true) + archiveOffset;
        const name = new TextDecoder().decode(bytes.slice(cursor + 46, cursor + 46 + nameLength));
        entries[name] = { method, compressedSize, localOffset };
        cursor += 46 + nameLength + extraLength + commentLength;
      }
      return entries;
    }

    function cellColumn(cellRef) {
      return cellRef.replace(/[0-9]/g, "");
    }

    async function loadWorkbook(silent = false) {
      if (!silent) statusEl.textContent = "[ READING ALBUM RECS.XLSX… ]";
      const response = await fetch(WORKBOOK_URL + "?updated=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("Could not load /files/IshMusic/album recs.xlsx (" + response.status + ").");
      const bytes = await response.arrayBuffer();
      const currentBytes = new Uint8Array(bytes);
      if (lastWorkbookBytes && currentBytes.length === lastWorkbookBytes.length && currentBytes.every((byte, index) => byte === lastWorkbookBytes[index])) return;
      lastWorkbookBytes = currentBytes;
      const entries = findZipEntries(bytes);
      const sharedXml = new DOMParser().parseFromString(await readZipEntry(bytes, entries["xl/sharedStrings.xml"]), "application/xml");
      const sheetXml = new DOMParser().parseFromString(await readZipEntry(bytes, entries["xl/worksheets/sheet1.xml"]), "application/xml");
      const shared = Array.from(sharedXml.getElementsByTagName("si"), item => Array.from(item.getElementsByTagName("t"), t => t.textContent).join(""));
      const sharedIndex = sharedXml.documentElement.namespaceURI;
      const ns = sharedIndex;
      const sheetData = Array.from(sheetXml.getElementsByTagNameNS(ns, "row"));
      const parsed = [];
      for (const row of sheetData) {
        const values = {};
        for (const cell of Array.from(row.children).filter(node => node.localName === "c")) {
          const valueNode = Array.from(cell.children).find(node => node.localName === "v");
          const inlineNode = Array.from(cell.children).find(node => node.localName === "is");
          let value = valueNode ? valueNode.textContent : inlineNode ? Array.from(inlineNode.getElementsByTagNameNS(ns, "t"), t => t.textContent).join("") : "";
          if (cell.getAttribute("t") === "s" && value !== "") value = shared[Number(value)] || "";
          const column = cellColumn(cell.getAttribute("r"));
          if (["B", "C", "D"].includes(column)) values[column] = value;
        }
        if (Object.values(values).some(value => String(value).trim())) parsed.push({ rowNumber: Number(row.getAttribute("r")), values });
      }
      const header = parsed.find(row => row.values.B === "Album Name" && row.values.C === "Artist Name");
      if (!header) throw new Error("Expected Album Name, Artist Name, and Vibe Notes columns were not found.");
      const headerRow = header.rowNumber;
      const headers = ["B", "C", "D"].map(col => header.values[col] || "");
      const rows = parsed.filter(row => row.rowNumber > headerRow).map(row => [row.values.B || "", row.values.C || "", row.values.D || ""]).filter(row => row.some(cell => String(cell).trim()));
      albumData = { headers, rows };
      renderTable();
      searchEl.disabled = false;
      statusEl.textContent = `[ ${rows.length} ALBUM RECS ]`;
    }

    function renderTable() {
      headersEl.replaceChildren(...albumData.headers.map(label => {
        const th = document.createElement("th");
        th.scope = "col";
        th.textContent = label;
        return th;
      }));
      const query = searchEl.value.trim().toLocaleLowerCase();
      const filtered = albumData.rows.filter(row => row.join(" ").toLocaleLowerCase().includes(query));
      if (!filtered.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.className = "empty-state";
        td.colSpan = Math.max(1, albumData.headers.length);
        td.textContent = "No album recommendations match that filter.";
        rowsEl.replaceChildren(tr.appendChild(td).parentElement);
        return;
      }
      rowsEl.replaceChildren(...filtered.map(row => {
        const tr = document.createElement("tr");
        row.forEach(value => {
          const td = document.createElement("td");
          td.textContent = value;
          tr.append(td);
        });
        return tr;
      }));
    }

    searchEl.addEventListener("input", renderTable);
    loadWorkbook().catch(error => {
      statusEl.textContent = "[ ALBUM LIST UNAVAILABLE ]";
      rowsEl.innerHTML = "<tr><td class=\"empty-state\" colspan=\"3\"></td></tr>";
      rowsEl.querySelector("td").textContent = error.message + " Reload the page after saving the workbook.";
      console.error(error);
    });
    // Refresh the table soon after a saved workbook change.
    window.setInterval(() => loadWorkbook(true).catch(error => console.error(error)), 30000);
  </script>
